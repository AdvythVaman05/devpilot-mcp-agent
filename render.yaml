services:
  - type: web
    name: devpilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m devpilot.main --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PROVIDER_MODE
        value: demo
    healthCheckPath: /api/health
    plan: free
