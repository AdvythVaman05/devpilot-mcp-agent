services:
  devpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devpilot-agent
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - devpilot_data:/app/data
    restart: unless-stopped

volumes:
  devpilot_data:
