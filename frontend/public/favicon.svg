<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="devpilot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#devpilot-grad)" filter="url(#shadow)" />
  <!-- Terminal Prompt '>_' and Navigational Delta -->
  <path d="M18 22 L28 32 L18 42" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="33" y1="42" x2="45" y2="42" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <!-- Pilot Flight Delta Indicator -->
  <polygon points="46,18 49,24 43,23" fill="#ffedd5" opacity="0.9" />
</svg>